<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Learning backend</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <!-- create simple web page structure -->
        <header>
            <h1>Welcome to My Website</h1>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section>
                <h2>About Me</h2>
                <p>
                    This is a simple web page structure created for learning
                    backend development.
                </p>
            </section>
            <section>
                <h2>Contact</h2>
                <form action="#" method="post">
                    <label for="name">Name:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    /><br /><br />
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    /><br /><br />
                    <input type="submit" value="Submit" />
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 My Website. All rights reserved.</p>
        </footer>
    </body>
</html>
